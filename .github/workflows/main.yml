name: SMC Trading Bot 24-7

on:
  workflow_dispatch:
  schedule:
    # يعاد تنشيطه كل 6 ساعات بانتظام بدون أي تكرار
    - cron: '0 */6 * * *'

# يمنع تكرار السيرفرات: يلغي أي سيرفر قديم فوراً ويبقي سيرفراً واحداً فقط نشطاً
concurrency:
  group: smc-trading-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: |
          pip install ccxt pandas requests

      - name: تشغيل البوت
        run: |
          python -u smc_tracker_bot.py
